name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    runs-on: macos-26
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests

  ui:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: script/test && script/lint && script/contract
