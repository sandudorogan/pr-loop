name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: ui/script/test && ui/script/lint
      - run: VERSION=${GITHUB_REF_NAME#v} ui/script/package
      - run: ui/script/notes "$GITHUB_REF_NAME" > ui/build/notes.md
      - run: >
          gh release create "$GITHUB_REF_NAME"
          ui/build/PR-Loop-*.dmg ui/build/PR-Loop-*.zip ui/build/SHA256SUMS
          --title "PR Loop $GITHUB_REF_NAME" --notes-file ui/build/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
