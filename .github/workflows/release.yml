name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: app/script/test && app/script/lint
      - run: VERSION=${GITHUB_REF_NAME#v} app/script/package
      - run: app/script/notes "$GITHUB_REF_NAME" > app/build/notes.md
      - run: >
          gh release create "$GITHUB_REF_NAME"
          app/build/PR-Wizard-*.dmg app/build/PR-Wizard-*.zip app/build/SHA256SUMS
          --title "PR Wizard $GITHUB_REF_NAME" --notes-file app/build/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
